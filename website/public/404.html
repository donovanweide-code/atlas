<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b1517" />
    <title>Pagina niet gevonden — We Build And Design</title>
    <style>
      :root {
        color: #f6f1e7;
        background: #07161c;
        font-family: Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 78% 24%, rgba(119, 154, 137, 0.22), transparent 24rem),
          linear-gradient(125deg, #07161c 0%, #102b2b 58%, #183b35 100%);
      }

      main {
        width: min(calc(100% - 2.5rem), 64rem);
        padding: clamp(4rem, 9vw, 8rem) 0;
      }

      p {
        margin: 0;
        color: #dcb46f;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 12ch;
        margin: 1.75rem 0 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.4rem, 8vw, 7.5rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 0.98;
      }

      main > span {
        display: block;
        max-width: 37rem;
        margin-top: 2rem;
        color: rgba(246, 241, 231, 0.75);
        font-size: clamp(1rem, 1.4vw, 1.2rem);
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        margin-top: 2.5rem;
        border-bottom: 1px solid rgba(246, 241, 231, 0.48);
        color: inherit;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        border-radius: 0.15rem;
        outline: 2px solid #dcb46f;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Niet gevonden</p>
      <h1>Deze pagina konden we niet vinden.</h1>
      <span>De pagina bestaat niet of is verplaatst. Ga terug naar de homepage om verder te kijken.</span>
      <a href="/">Terug naar de homepage</a>
    </main>
  </body>
</html>
