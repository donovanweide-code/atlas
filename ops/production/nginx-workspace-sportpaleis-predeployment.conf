# PREPARED ONLY. Do not install or enable without a separate HUMAN DEPLOY GO.
# Primary pilot host: workspace.sportpaleis.nl.

upstream wbd_workspace_runtime {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name workspace.sportpaleis.nl;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://workspace.sportpaleis.nl$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name workspace.sportpaleis.nl;

    ssl_certificate /etc/letsencrypt/live/workspace.sportpaleis.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workspace.sportpaleis.nl/privkey.pem;

    location = /healthz { proxy_pass http://wbd_workspace_runtime/health; include /etc/nginx/proxy_params; }
    location = /readyz { proxy_pass http://wbd_workspace_runtime/ready/sportpaleis; include /etc/nginx/proxy_params; }
    location = /health/ready { proxy_pass http://wbd_workspace_runtime/ready/sportpaleis; include /etc/nginx/proxy_params; }
    location = /health/sportpaleis { proxy_pass http://wbd_workspace_runtime/health/sportpaleis; include /etc/nginx/proxy_params; }
    location = /ready/sportpaleis { proxy_pass http://wbd_workspace_runtime/ready/sportpaleis; include /etc/nginx/proxy_params; }
    location = /robots.txt { proxy_pass http://wbd_workspace_runtime/robots.txt; include /etc/nginx/proxy_params; }
    location = /sportpaleis.webmanifest { proxy_pass http://wbd_workspace_runtime/sportpaleis.webmanifest; include /etc/nginx/proxy_params; }
    location = /sportpaleis-sw.js { proxy_pass http://wbd_workspace_runtime/sportpaleis-sw.js; include /etc/nginx/proxy_params; }
    location = /sportpaleis-pwa-icon.svg { proxy_pass http://wbd_workspace_runtime/sportpaleis-pwa-icon.svg; include /etc/nginx/proxy_params; }
    location /assets/ { proxy_pass http://wbd_workspace_runtime; include /etc/nginx/proxy_params; }
    location /workspace/ { proxy_pass http://wbd_workspace_runtime; include /etc/nginx/proxy_params; }
    location /api/ {
        proxy_pass http://wbd_workspace_runtime;
        include /etc/nginx/proxy_params;
        client_max_body_size 8m;
    }

    # workspace.sportpaleis.nl is a dedicated authenticated application host.
    # The runtime owns the allowlisted short-route boundary and returns 404 for
    # every path outside it; proxying here keeps deep links and legacy 308
    # redirects inside the same authenticated application boundary.
    location / {
        proxy_pass http://wbd_workspace_runtime;
        include /etc/nginx/proxy_params;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

# Keep workspace.webuildanddesign.nl on its existing application route during
# validation. Only after the new host passes live smoke may a separately approved
# server block redirect its Sportpaleis paths with 308 to the primary host.
